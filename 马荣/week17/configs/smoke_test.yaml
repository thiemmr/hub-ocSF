model:
  name_or_path: Qwen/Qwen2.5-0.5B-Instruct
  trust_remote_code: false
  precision: bfloat16
  attn_implementation: sdpa
  quantization: 4bit

lora:
  enabled: true
  r: 8
  alpha: 16
  dropout: 0.0
  bias: none
  target_modules: [q_proj, k_proj, v_proj, o_proj]

data:
  dataset_name: openai/gsm8k
  dataset_config: main
  train_split: train
  eval_split: null
  validation_fraction: 0.05
  question_column: question
  answer_column: answer
  max_train_samples: 32
  max_eval_samples: 16
  seed: 42
  system_prompt: |-
    Solve the problem step by step. Return exactly:
    <reasoning>your derivation</reasoning>
    <answer>final answer only</answer>

rewards:
  correctness: 1.0
  strict_format: 0.15
  reasoning_quality: 0.05
  repetition_penalty: 0.05

trainer:
  output_dir: outputs/smoke-test
  max_steps: 2
  learning_rate: 5.0e-6
  warmup_steps: 0.0
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 4
  gradient_checkpointing: true
  gradient_checkpointing_kwargs: {use_reentrant: false}
  num_generations: 4
  num_generations_eval: 1
  max_completion_length: 128
  temperature: 0.9
  beta: 0.0
  loss_type: dr_grpo
  scale_rewards: batch
  mask_truncated_completions: true
  logging_steps: 1
  logging_first_step: true
  eval_strategy: 'no'
  save_strategy: 'no'
  report_to: none
  seed: 42
  use_vllm: false
